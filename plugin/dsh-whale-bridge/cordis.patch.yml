# dsh-whale-bridge bundle layer: one Host row, no client/browser half.
#
# The row mounts on the profile's webServer service (the Desktop composition
# always has one: `@deepseek-ai/dsh-host-webserver` bound on 127.0.0.1 with an
# OS-assigned port) and exposes:
#   - GET /api/whale/status on that loopback server
#   - <DSH_HOME>/whale-bridge/status.json atomically, heartbeat every 5s
#
# Optional per-profile overrides can be added to the profile's own
# cordis.patch.yml (applied after every bundle layer):
#
#   - id: dsh-whale-bridge
#     name: dsh-whale-bridge
#     config:
#       statusFile: '%USERPROFILE%\.dsh\whale-bridge\status.json'
#       heartbeatMs: 5000
- insert:
    - id: dsh-whale-bridge
      name: dsh-whale-bridge
