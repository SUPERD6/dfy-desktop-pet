<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob: data:">
  <title>大肥鱼 3D</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; user-select: none; }
    canvas { display: block; }
    #bubble {
      position: absolute; left: 50%; top: 12px; transform: translateX(-50%);
      max-width: 340px; padding: 8px 14px; border-radius: 14px;
      background: #fff; color: #1f2a44; border: 2px solid #a9c3f2;
      font: 15px/1.45 "Microsoft YaHei", sans-serif; text-align: center;
      box-shadow: 0 2px 6px rgba(40, 70, 140, .18);
      opacity: 0; transition: opacity .25s; pointer-events: none;
    }
    #bubble.show { opacity: 1; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "./node_modules/three/build/three.module.js",
      "three/addons/": "./node_modules/three/examples/jsm/",
      "@pixiv/three-vrm": "./node_modules/@pixiv/three-vrm/lib/three-vrm.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="bubble"></div>
  <script type="module" src="./renderer.js"></script>
</body>
</html>
